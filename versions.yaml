# Machine-readable version manifest for sunspec-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles are the source of truth for a build:
# scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.3.0"
contract_version: "1.2"        # docs/CONTAINER_CONTRACT.md
fixture_schema: "1.0"          # schemas/fixture.schema.json

protocol:
  name: "SunSpec Modbus"
  default_port: 1502           # inside the images; the registered port 502 needs root

implementations:
  pysunspec2:
    priority: P0
    upstream: "pysunspec2"
    repository: "https://github.com/sunspec/pysunspec2"
    artifact: "pypi:pysunspec2"
    version: "1.3.7"
    wheel_sha256: "4bc5029ac2ee9ec8ea7bf7e4623c0fc269244c2f0292b2b7dca8588a4287eeeb"
    license: "Apache-2.0"
    bundled:
      pyserial: "3.5"          # BSD-3-Clause, wheel sha256 c4451db6ba391ca6ca299fb3ec7bae67a5c55dde170964c7a14ceefec02f2cf0
    language: "Python"
    independent_engine: true
    roles: [server, client]
    published: true

  cbsigma:
    priority: P1
    upstream: "cB-Sigma sunspec"
    repository: "https://github.com/cB-Sigma/sunspec"
    module: "github.com/cB-Sigma/sunspec"
    version: "v0.3.0"            # latest tag; the project publishes tags, no GitHub releases
    revision: "c99cbef0ba8fefb8433663db152f9fdde8c7adb1"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]     # client: cB-Sigma sunspec; device: cB-Sigma sunspec-sim
    published: true
    dependencies:
      sunspec-sim: "github.com/cB-Sigma/sunspec-sim v0.3.0 e407ee734647776195ce40fe6bdbffcb8ee05d6e (Apache-2.0), the device"
      modbus: "github.com/simonvetter/modbus v1.6.4 (MIT)"
      serial: "github.com/goburrow/serial v0.1.0 (MIT)"

# OT Fabric's own stack behind the contract, for others to test against
# (own/go-sunspec/README.md). Not a reference, not in a release or
# manifest.json, and no pin: the Own stack (go-sunspec) workflow builds the
# latest go-sunspec release by hand.
own_implementations:
  otfabric:
    upstream: "go-sunspec"
    repository: "https://github.com/otfabric/go-sunspec"
    artifact: "go:github.com/otfabric/go-sunspec"
    version: "latest release, resolved when the image is built by hand"
    license: "MIT"
    language: "Go"
    independent_engine: false
    roles: [server, client]
    image: "ghcr.io/otfabric/sunspec-interop-otfabric"
    build: "own/go-sunspec"

base_images:
  # Multi-arch index digests. Each Dockerfile names them as *_DIGEST build
  # arguments.
  python:
    tag: "3.14.8-slim-trixie"
    digest: "sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170"
    used_by: [pysunspec2]
  golang:
    tag: "1.27.2-trixie"
    digest: "sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d"
    used_by: [cbsigma, otfabric]
  debian:
    tag: "trixie-slim"
    digest: "sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4"
    used_by: [cbsigma, otfabric]
